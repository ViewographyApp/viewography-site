<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Viewography — Your Life on Screen</title>

  <meta
    name="description"
    content="Viewography is a personal movie and television companion."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="hero">

    <div class="brand-lockup">

      <div class="brand" aria-label="Viewography">
        <span class="brand-view">VI</span>

        <span class="brand-e" aria-hidden="true">
          <i></i>
          <i></i>
          <i></i>
        </span>

        <span class="brand-view">W</span>
        <span class="brand-ography">OGRAPHY</span>
      </div>

      <div class="brand-actions">

        <div class="brand-action">
          <svg class="reel" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="22" cy="22" r="18"/>
            <circle cx="22" cy="12" r="3"/>
            <circle cx="31" cy="19" r="3"/>
            <circle cx="27" cy="30" r="3"/>
            <circle cx="15" cy="30" r="3"/>
            <circle cx="13" cy="18" r="3"/>
            <path d="M35 35l9 9"/>
          </svg>

          <span>Track</span>
        </div>

        <i class="action-divider"></i>

        <div class="brand-action">
          <svg class="search-icon" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="20" cy="20" r="13"/>
            <path d="M30 30l13 13"/>
          </svg>

          <span>Discover</span>
        </div>

        <i class="action-divider"></i>

        <div class="brand-action">
          <svg class="screen-icon" viewBox="0 0 52 48" aria-hidden="true">
            <rect x="5" y="6" width="42" height="30" rx="4"/>
            <path d="M19 43h14M26 36v7"/>
          </svg>

          <span>Watch More</span>
        </div>

      </div>
    </div>

    <h1>
      Your Life<br>
      on Screen.
    </h1>

    <p class="lede">
      A personal movie &amp; television companion for deciding what to watch,
      remembering what you've seen, and understanding your viewing life.
    </p>

    <div class="rule"></div>

    <p class="coming">
      Coming to the App Store.
    </p>

    <section class="app-stage" aria-label="Viewography app previews">

      <div class="stage-glow orange-glow"></div>
      <div class="stage-glow blue-glow"></div>

      <figure class="phone-card phone-left">
        <div class="phone-shell">
          <img
            src="assets/up-next.png"
            alt="Viewography What's Up Next screen"
          >
        </div>
      </figure>

      <figure class="phone-card phone-right">
        <div class="phone-shell">
          <img
            src="assets/what-to-watch.png"
            alt="Viewography What to Watch screen"
          >
        </div>
      </figure>

    </section>

  </main>

  <footer>
    <span>© 2026 Viewography</span>

    <nav>
      <a href="/privacy">Privacy</a>
      <a href="support.html">Support</a>
    </nav>
  </footer>

</body>
</html>
